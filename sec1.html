<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Barakat | Skills</title>

  <style>
    /* ======================
       Global Styles & Reset
    ====================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0a0a0a;
      color: #ffffff;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    /* ======================
       Navbar
    ====================== */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: #0a0a0a;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
    }

    .logo span {
      color: #e31c25;
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      color: #e0e0e0;
      font-size: 1rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #e31c25;
    }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 1001;
    }

    .hamburger span {
      display: block;
      height: 3px;
      width: 100%;
      background-color: #ffffff;
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    .hamburger.active span:nth-child(1) {
      transform: translateY(8.5px) rotate(45deg);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: translateY(-8.5px) rotate(-45deg);
    }

    /* ======================
       Section Title
    ====================== */
    .section-title {
      font-size: 2.8rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 60px;
      position: relative;
    }

    .section-title::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 0;
      width: 60px;
      height: 3px;
      background-color: #e31c25;
    }

    /* ======================
       Skills Section
    ====================== */
    .skills {
      padding: 120px 0;
      background-color: #0f0f0f;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 50px;
      margin-top: 20px;
    }

    .skill-category h3 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 30px;
      position: relative;
      padding-bottom: 12px;
    }

    .skill-category h3::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 40px;
      height: 3px;
      background-color: #e31c25;
    }

    .skill-items {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .skill-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skill-name {
      font-size: 0.95rem;
      color: #e0e0e0;
      font-weight: 500;
    }

    .skill-bar {
      width: 100%;
      height: 8px;
      background-color: #1f1f1f;
      border-radius: 50px;
      overflow: hidden;
    }

    .skill-progress {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #e31c25, #ff4d57);
      border-radius: 50px;
      transition: width 1.6s ease;
    }

    /* ======================
       Responsive
    ====================== */
    @media (max-width: 768px) {
      nav {
        padding: 16px 24px;
      }

      .hamburger {
        display: flex;
      }

      .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 70%;
        max-width: 300px;
        height: 100vh;
        background-color: #141414;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 40px;
        transition: right 0.4s ease;
        border-left: 1px solid #222;
        z-index: 999;
      }

      .nav-links.active {
        right: 0;
      }

      .nav-links a {
        font-size: 1.3rem;
      }

      .container {
        padding: 0 24px;
      }

      .section-title {
        font-size: 2.2rem;
        margin-bottom: 40px;
      }

      .skills {
        padding: 80px 0;
      }

      .skills-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <a href="/index.html" class="logo">Ahmed Barakat<span>.</span></a>

    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="sec2.html">Projects</a></li>
      <li><a href="sec1.html">Skills</a></li>
      <li><a href="sec3.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Skills Section -->
  <section id="skills" class="skills">
    <div class="container">
      <h2 class="section-title">Skills</h2>

      <div class="skills-grid">
        <!-- Frontend -->
        <div class="skill-category">
          <h3>Frontend</h3>
          <div class="skill-items">
            <div class="skill-item">
              <span class="skill-name">HTML5</span>
              <div class="skill-bar">
                <div class="skill-progress" data-width="95%"></div>
              </div>
            </div>
            <div class="skill-item">
              <span class="skill-name">CSS3</span>
              <div class="skill-bar">
                <div class="skill-progress" data-width="90%"></div>
              </div>
            </div>
            <div class="skill-item">
              <span class="skill-name">JavaScript</span>
              <div class="skill-bar">
                <div class="skill-progress" data-width="85%"></div>
              </div>
            </div>
            <div class="skill-item">
              <span class="skill-name">React</span>
              <div class="skill-bar">
                <div class="skill-progress" data-width="75%"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tools & Others -->
        <div class="skill-category">
          <h3>Tools & Others</h3>
          <div class="skill-items">
            <div class="skill-item">
              <span class="skill-name">Git & GitHub</span>
              <div class="skill-bar">
                <div class="skill-progress" data-width="88%"></div>
              </div>
            </div>
            <div class="skill-item">
              <span class="skill-name">Responsive Design</span>
              <div class="skill-bar">
                <div class="skill-progress" data-width="92%"></div>
              </div>
            </div>
            <div class="skill-item">
              <span class="skill-name">Figma</span>
              <div class="skill-bar">
                <div class="skill-progress" data-width="70%"></div>
              </div>
            </div>
            <div class="skill-item">
              <span class="skill-name">Tailwind CSS</span>
              <div class="skill-bar">
                <div class="skill-progress" data-width="80%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // Navbar Toggle
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('active');
    });

    // Close menu when clicking a link
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navLinks.classList.remove('active');
      });
    });

    // Animate skill bars when they appear
    const skillBars = document.querySelectorAll('.skill-progress');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const bar = entry.target;
          bar.style.width = bar.getAttribute('data-width');
          observer.unobserve(bar);
        }
      });
    }, { threshold: 0.3 });

    skillBars.forEach(bar => observer.observe(bar));
  </script>

</body>
</html>
