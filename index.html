<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Barakat | Frontend Developer</title>

  <style>
    /* ======================
       Global Styles
    ====================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0a0a0a;
      color: #ffffff;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    /* ======================
       Navbar
    ====================== */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: #0a0a0a;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
    }

    .logo span {
      color: #e31c25;
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      color: #e0e0e0;
      font-size: 1rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #e31c25;
    }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 1001;
    }

    .hamburger span {
      display: block;
      height: 3px;
      width: 100%;
      background-color: #ffffff;
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    .hamburger.active span:nth-child(1) {
      transform: translateY(8.5px) rotate(45deg);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: translateY(-8.5px) rotate(-45deg);
    }

    /* ======================
       Hero Section
    ====================== */
    .hero {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      padding: 0 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero-content {
      max-width: 720px;
    }

    .greeting {
      font-size: 1.1rem;
      color: #e31c25;
      font-weight: 500;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .hero h1 {
      font-size: 3.4rem;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 24px;
      color: #ffffff;
    }

    .hero h1 span {
      color: #e31c25;
    }

    .typing-text {
      font-size: 1.6rem;
      font-weight: 500;
      color: #e0e0e0;
      margin-bottom: 28px;
      min-height: 40px;
    }

    .typing-text .cursor {
      display: inline-block;
      width: 3px;
      height: 1.4rem;
      background-color: #e31c25;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hero-description {
      font-size: 1.15rem;
      color: #a0a0a0;
      max-width: 560px;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .hero-buttons {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 50px;
      transition: all 0.35s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: #e31c25;
      color: #ffffff;
      border: 1.5px solid #e31c25;
    }

    .btn-primary:hover {
      background-color: transparent;
      color: #e31c25;
    }

    .btn-outline {
      background-color: transparent;
      color: #ffffff;
      border: 1.5px solid #444;
    }

    .btn-outline:hover {
      border-color: #e31c25;
      color: #e31c25;
    }

    /* ======================
       Responsive
    ====================== */
    @media (max-width: 768px) {
      nav {
        padding: 16px 24px;
      }

      .hamburger {
        display: flex;
      }

      .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 70%;
        max-width: 300px;
        height: 100vh;
        background-color: #141414;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 40px;
        transition: right 0.4s ease;
        border-left: 1px solid #222;
        z-index: 999;
      }

      .nav-links.active {
        right: 0;
      }

      .nav-links a {
        font-size: 1.3rem;
      }

      .hero {
        padding: 60px 24px;
        min-height: auto;
      }

      .hero h1 {
        font-size: 2.4rem;
      }

      .typing-text {
        font-size: 1.25rem;
      }

      .hero-description {
        font-size: 1.05rem;
      }

      .btn {
        padding: 12px 28px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <a href="/index.html" class="logo">Ahmed Barakat<span>.</span></a>

    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="sec2.html">Projects</a></li>
      <li><a href="sec1.html">Skills</a></li>
      <li><a href="sec3.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <p class="greeting">Hello, I'm</p>
      <h1>Ahmed Barakat</h1>

      <div class="typing-text">
        <span id="typed-text"></span><span class="cursor"></span>
      </div>

      <p class="hero-description">
        Frontend Developer passionate about building clean, modern, and 
        responsive web experiences. I turn ideas into beautiful interfaces 
        using the latest web technologies.
      </p>

      <div class="hero-buttons">
        <a href="sec2.html" class="btn btn-primary">View Projects</a>
        <a href="sec3.html" class="btn btn-outline">Contact Me</a>
      </div>
    </div>
  </section>

  <script>
    // ======================
    // Navbar Toggle
    // ======================
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('active');
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navLinks.classList.remove('active');
      });
    });

    // ======================
    // Typing Effect
    // ======================
    const texts = [
      "Frontend Developer",
      "UI/UX Enthusiast",
      "React Developer",
      "Creative Coder"
    ];

    let textIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typedText = document.getElementById('typed-text');
    const typingSpeed = 100;
    const deletingSpeed = 50;
    const pauseTime = 1800;

    function type() {
      const currentText = texts[textIndex];

      if (isDeleting) {
        typedText.textContent = currentText.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typedText.textContent = currentText.substring(0, charIndex + 1);
        charIndex++;
      }

      if (!isDeleting && charIndex === currentText.length) {
        // Pause at the end
        isDeleting = true;
        setTimeout(type, pauseTime);
        return;
      }

      if (isDeleting && charIndex === 0) {
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
      }

      const speed = isDeleting ? deletingSpeed : typingSpeed;
      setTimeout(type, speed);
    }

    // Start typing after a short delay
    setTimeout(type, 800);
  </script>

</body>
</html>
